name: Android Signed APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Read app version
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION"; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Validate signing Secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE" ] || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore and validate temporary keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/meugiga-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/meugiga-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Tests, lint, signed APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/meugiga-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MeuGiga-${APP_VERSION}-release-signed.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/MeuGiga-${APP_VERSION}-release-signed.aab"
          ls -lh dist/*

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: MeuGiga-${{ env.APP_VERSION }}-signed-apk-aab
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="meugiga-v${APP_VERSION}-${SHORT_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its original artifacts."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/MeuGiga-${APP_VERSION}-release-signed.apk" \
            "dist/MeuGiga-${APP_VERSION}-release-signed.aab" \
            --target "$GITHUB_SHA" \
            --title "MeuGiga ${APP_VERSION} (${SHORT_SHA})" \
            --notes "APK e AAB release assinados pelo GitHub Actions. Commit: $GITHUB_SHA" \
            --prerelease
