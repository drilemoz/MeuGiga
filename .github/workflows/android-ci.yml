name: Android CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Lint, unit tests and debug APK
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Publish debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeuGiga-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
